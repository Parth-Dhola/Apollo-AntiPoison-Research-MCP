[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apollo-mcp"
version = "0.1.0"
description = "Anti-Poisoned Multi-Source Academic & Code Context MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "diskcache>=5.6.3",
    "flashrank>=0.2.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "duckduckgo-search>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
apollo = "apollo.main:main"
apollo-router = "apollo.router.tool_selector:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

